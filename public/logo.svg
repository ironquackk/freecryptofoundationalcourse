<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#1e293b"/>
  <rect x="1" y="1" width="30" height="30" rx="5" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Candlestick 1 (small red) -->
  <line x1="8" y1="12" x2="8" y2="22" stroke="#ef4444" stroke-width="1"/>
  <rect x="6.5" y="14" width="3" height="5" rx="0.5" fill="#ef4444"/>
  <!-- Candlestick 2 (medium green) -->
  <line x1="13" y1="8" x2="13" y2="20" stroke="#22c55e" stroke-width="1"/>
  <rect x="11.5" y="10" width="3" height="7" rx="0.5" fill="#22c55e"/>
  <!-- Candlestick 3 (tall green) -->
  <line x1="18" y1="6" x2="18" y2="19" stroke="#22c55e" stroke-width="1"/>
  <rect x="16.5" y="8" width="3" height="8" rx="0.5" fill="#22c55e"/>
  <!-- Candlestick 4 (tall green) -->
  <line x1="23" y1="4" x2="23" y2="17" stroke="#f59e0b" stroke-width="1"/>
  <rect x="21.5" y="6" width="3" height="8" rx="0.5" fill="#f59e0b"/>
  <!-- Trend line -->
  <polyline points="8,16 13,12 18,10 23,8" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Graduation cap hint at top -->
  <polygon points="23,4 26,6 23,8 20,6" fill="#f59e0b" opacity="0.8"/>
  <line x1="23" y1="6" x2="23" y2="10" stroke="#f59e0b" stroke-width="0.8" opacity="0.8"/>
</svg>
